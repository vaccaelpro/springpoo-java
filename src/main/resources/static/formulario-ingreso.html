<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Ingreso - SENA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: 'Segoe UI', sans-serif;
          background: #f0f4f8;
          min-height: 100vh;
          display: flex;
          align-items: flex-start;
          justify-content: center;
          padding: 30px 16px;
        }
        .card {
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 4px 20px rgba(0,0,0,.1);
          width: 100%;
          max-width: 500px;
          overflow: hidden;
        }
        .card-header {
          background: #39A900;
          color: #fff;
          padding: 24px 32px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .card-header h1 { font-size: 1.2rem; }
        .card-header p  { font-size: .82rem; opacity: .85; margin-top: 4px; }
        .card-header a {
          background: #fff; color: #39A900;
          padding: 7px 16px; border-radius: 7px;
          font-weight: 700; font-size: .82rem;
          text-decoration: none; white-space: nowrap;
        }
        form { padding: 28px 32px; }
        .section-title {
          font-size: .78rem; font-weight: 700; color: #39A900;
          text-transform: uppercase; letter-spacing: .08em;
          margin: 20px 0 12px; padding-bottom: 6px;
          border-bottom: 2px solid #e8f5e9;
        }
        label {
          display: block; font-size: .82rem;
          font-weight: 600; color: #444; margin-bottom: 4px;
        }
        label span.req { color: #e53935; }
        input, select {
          width: 100%; padding: 9px 12px;
          border: 1.5px solid #cfd8dc; border-radius: 7px;
          font-size: .9rem; color: #333; background: #fafafa;
          transition: border-color .2s; margin-bottom: 14px;
        }
        input:focus, select:focus {
          outline: none; border-color: #39A900; background: #fff;
        }
        .error-msg {
          font-size: .75rem; color: #e53935;
          margin-top: -10px; margin-bottom: 10px; display: none;
        }
        .lang-toggle {
          display: flex; gap: 10px; margin-bottom: 20px;
        }
        .lang-btn {
          flex: 1; padding: 8px;
          border: 2px solid #cfd8dc; border-radius: 7px;
          background: #fafafa; cursor: pointer;
          font-weight: 700; font-size: .85rem;
          transition: all .2s;
        }
        .lang-btn.active {
          border-color: #39A900; background: #e8f5e9; color: #39A900;
        }
        .btn-submit {
          width: 100%; padding: 13px;
          background: #39A900; color: #fff;
          font-size: 1rem; font-weight: 700;
          border: none; border-radius: 8px;
          cursor: pointer; transition: background .2s;
        }
        .btn-submit:hover { background: #2e8700; }
        .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
        .toast {
          display: none; margin-top: 16px;
          padding: 12px 16px; border-radius: 8px;
          font-size: .9rem; font-weight: 600;
        }
        .toast.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .toast.error   { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <div>
            <h1 id="titulo">Registrar Ingreso</h1>
            <p>Sistema de apoyo de sostenimiento · SENA</p>
        </div>
        <a href="index.html">← Inicio</a>
    </div>

    <form id="formIngreso" novalidate>
        <div class="section-title" id="label-idioma">Idioma de respuesta</div>
        <div class="lang-toggle">
            <button type="button" class="lang-btn active" id="btn-es" onclick="setLang('es')">🇨🇴 Español</button>
            <button type="button" class="lang-btn"        id="btn-en" onclick="setLang('en')">🇺🇸 English</button>
        </div>

        <div class="section-title" id="label-datos">Datos del ingreso</div>

        <label id="label-monto">Monto <span class="req">*</span></label>
        <input type="number" id="monto" placeholder="Ej: 150000" min="1" />
        <span class="error-msg" id="err-monto">Ingrese un monto válido mayor a 0</span>

        <label id="label-fecha">Fecha <span class="req">*</span></label>
        <input type="date" id="fecha" />
        <span class="error-msg" id="err-fecha">La fecha es requerida</span>

        <button type="submit" class="btn-submit" id="btnSubmit">Registrar</button>
        <div class="toast" id="toast"></div>
    </form>
</div>

<script>
    let lang = 'es';

    const textos = {
      es: {
        titulo: 'Registrar Ingreso',
        labelIdioma: 'Idioma de respuesta',
        labelDatos: 'Datos del ingreso',
        labelMonto: 'Monto',
        labelFecha: 'Fecha',
        errMonto: 'Ingrese un monto válido mayor a 0',
        errFecha: 'La fecha es requerida',
        btnRegistrar: 'Registrar',
        btnGuardando: 'Guardando...'
      },
      en: {
        titulo: 'Register Income',
        labelIdioma: 'Response language',
        labelDatos: 'Income data',
        labelMonto: 'Amount',
        labelFecha: 'Date',
        errMonto: 'Enter a valid amount greater than 0',
        errFecha: 'Date is required',
        btnRegistrar: 'Register',
        btnGuardando: 'Saving...'
      }
    };

    function setLang(l) {
      lang = l;
      const t = textos[l];
      document.getElementById('titulo').textContent       = t.titulo;
      document.getElementById('label-idioma').textContent = t.labelIdioma;
      document.getElementById('label-datos').textContent  = t.labelDatos;
      document.getElementById('label-monto').innerHTML    = t.labelMonto + ' <span class="req">*</span>';
      document.getElementById('label-fecha').innerHTML    = t.labelFecha + ' <span class="req">*</span>';
      document.getElementById('err-monto').textContent    = t.errMonto;
      document.getElementById('err-fecha').textContent    = t.errFecha;
      document.getElementById('btnSubmit').textContent    = t.btnRegistrar;
      document.getElementById('btn-es').classList.toggle('active', l === 'es');
      document.getElementById('btn-en').classList.toggle('active', l === 'en');
    }

    function showError(id, show) {
      document.getElementById('err-' + id).style.display = show ? 'block' : 'none';
      document.getElementById(id).style.borderColor = show ? '#e53935' : '#cfd8dc';
    }

    function mostrarToast(msg, tipo) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + tipo;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 5000);
    }

    document.getElementById('formIngreso').addEventListener('submit', async function(e) {
      e.preventDefault();
      let valid = true;

      const monto = parseFloat(document.getElementById('monto').value);
      const fecha = document.getElementById('fecha').value;

      if (!monto || monto <= 0) { showError('monto', true); valid = false; }
      else showError('monto', false);

      if (!fecha) { showError('fecha', true); valid = false; }
      else showError('fecha', false);

      if (!valid) return;

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = textos[lang].btnGuardando;

      try {
        const res = await fetch('/ingreso/registrar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept-Language': lang
          },
          body: JSON.stringify({ monto, fecha })
        });
        
        if (res.status >= 500) {
          window.location.href = '/500.html';
          return;
        }

        const resultado = await res.text();
        const esExito = resultado.toLowerCase().includes('id') || resultado.toLowerCase().includes('registered');
        mostrarToast((esExito ? '✅ ' : '❌ ') + resultado, esExito ? 'success' : 'error');
        if (esExito) document.getElementById('formIngreso').reset();

      } catch (err) {
        window.location.href = '/500.html';
      } finally {
        btn.disabled = false;
        btn.textContent = textos[lang].btnRegistrar;
      }
    });
</script>
</body>
</html>
