spring.application.name=springpoo

spring.datasource.url=jdbc:mysql://localhost:3306/springpoo_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.whitelabel.enabled=false
server.error.path=/error

# Deshabilitar caché para recursos estáticos (HTML/JS)
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.period=0

# CORS - origen permitido del frontend
cors.allowed-origin=http://localhost:8080

# Logging - ruta del archivo (respaldo si no se usa logback-spring.xml)
logging.file.name=logs/springpoo.log

# N8N - URL del webhook de n8n
n8n.webhook.url=https://senagdf.app.n8n.cloud/webhook-test/subir-archivos